<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PDF Tools</title>
    <meta name="description" content="Merge, split, compress, protect, sign and watermark PDFs. Everything runs on your computer." />
    <meta name="theme-color" content="#2f6fed" />
    <link rel="icon" href="icon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!-- Small screens: an app bar with Back and the tools menu. -->
    <header id="topbar">
      <button id="back" class="bar-button" type="button" aria-label="All tools" hidden>
        <span class="icon" style="--icon: url(icons/chevron-left.svg)"></span>
      </button>
      <img id="bar-logo" src="icon.png" alt="" />
      <span id="bar-title">PDF Tools</span>
      <button id="menu" class="bar-button" type="button" aria-label="Tools" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </header>
    <div id="scrim" hidden></div>

    <aside id="sidebar">
      <button id="brand" class="brand" type="button"><img src="icon.png" alt="" /> PDF Tools</button>
      <nav id="nav" aria-label="Tools"></nav>
      <button id="install" class="install" type="button" hidden>Install app</button>
      <p class="local">Runs in your browser with WebAssembly. Files never leave your computer.</p>
    </aside>
    <main id="main">
      <p id="loading" class="status">Loading the PDF engine…</p>
    </main>
    <dialog id="zoom">
      <form method="dialog"><button class="icon-button close" aria-label="Close">×</button></form>
      <canvas></canvas>
    </dialog>
  </body>
</html>
