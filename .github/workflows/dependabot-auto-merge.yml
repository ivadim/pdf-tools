name: Dependabot auto-merge

# Patch updates from Dependabot merge on their own once every required check
# passes ("CI passed" and CodeQL). Minor and major updates wait for a review.
# Nothing from the pull request runs here: only Dependabot's metadata is read.

on:
  pull_request:

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    # Only Dependabot's own branches in this repository.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # merge
      pull-requests: write # turn on auto-merge
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Auto-merge patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
