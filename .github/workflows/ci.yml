name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly, for advisories published since the last push (Security job only).
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize the macOS package
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Linux builds need nothing from the system (the toolchain and C runtime are
  # hermetic). The text-rendering tests use the system's fonts, so they need
  # fontconfig, which the app loads at runtime, and one font.
  LINUX_DEPS: libfontconfig1 fonts-dejavu-core

jobs:
  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-test
          repository-cache: true
      - uses: $/.github/actions/buildbuddy
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          read -ra deps <<< "$LINUX_DEPS"
          sudo apt-get update && sudo apt-get install -y "${deps[@]}"
      - name: Unit, integration and UI tests
        run: bazel test --config=ci //...

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-lint
          repository-cache: true
      - uses: $/.github/actions/buildbuddy
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Formatting (rustfmt)
        run: bazel build --config=ci --config=rustfmt //...
      - name: Rust lints (Clippy, warnings are errors)
        run: bazel build --config=ci --config=clippy //...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No cache in a workflow that publishes releases (cache poisoning).
          package-manager-cache: false
      - name: Web lints (ESLint)
        working-directory: web
        run: |
          npm ci --no-fund
          npm run lint

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # zizmor's findings, outside pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust dependencies (vulnerabilities, licences, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: Workflows (zizmor)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # On pull requests findings fail the job; otherwise they go to
          # Security → Code scanning (fork pull requests can't upload).
          advanced-security: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Web lint tooling (npm audit)
        working-directory: web
        run: npm audit --audit-level=high

  coverage:
    name: Coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-coverage
          repository-cache: true
      - uses: $/.github/actions/buildbuddy
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Install Linux dependencies
        run: |
          read -ra deps <<< "$LINUX_DEPS"
          sudo apt-get update && sudo apt-get install -y "${deps[@]}"
      - name: Line coverage of at least 80%
        run: |
          bazel coverage --config=ci --combined_report=lcov //...
          # Product code only: the integration tests' own sources are left out.
          awk -F: '/^SF:/ { test = ($2 ~ /\/tests\//) } /^LF:/ && !test { found += $2 } /^LH:/ && !test { hit += $2 }
            END { pct = 100 * hit / found; printf "Line coverage: %d/%d = %.1f%%\n", hit, found, pct; exit pct < 80 }' \
            bazel-out/_coverage/_coverage_report.dat

  build:
    name: Build (${{ matrix.name }})
    needs: [test, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: linux-x86_64
            # Linked against glibc 2.28 stubs whatever the runner's glibc is.
            os: ubuntu-latest
          - name: macos-arm64
            # Apple silicon runner: a native arm64 build.
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Release builds (tags) start clean: nothing restored from caches that
      # other runs wrote (cache poisoning).
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          disk-cache: ${{ !startsWith(github.ref, 'refs/tags/') && format('{0}-release', github.workflow) }}
          repository-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: $/.github/actions/buildbuddy
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' version.bzl)-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKAGE=pdftools-$version-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          bazel build --config=ci --config=release //crates/pdftools-app:pdftools
          # Out of bazel-bin (read-only) for packaging.
          exe=pdftools; [[ "$RUNNER_OS" == Windows ]] && exe=pdftools.exe
          mkdir -p dist
          cp "bazel-bin/crates/pdftools-app/$exe" dist/
          chmod u+w "dist/$exe"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:PACKAGE | Out-Null
          Copy-Item dist/pdftools.exe, README.md, LICENSE $env:PACKAGE
          Compress-Archive -Path $env:PACKAGE -DestinationPath "$env:PACKAGE.zip"
          "ASSET=$env:PACKAGE.zip" | Out-File -Append $env:GITHUB_ENV

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          # File versions must be numeric: "0.2.0-abc1234" becomes "0.2.0".
          $numeric = $env:VERSION -replace '-.*$', ''
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DNumericVersion=$numeric" "/DSourceDir=$PWD\dist" packaging\windows\pdftools.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item "packaging\windows\$env:PACKAGE-setup.exe" .
          "INSTALLER=$env:PACKAGE-setup.exe" | Out-File -Append $env:GITHUB_ENV

      - name: Try the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'pdftools-install'
          $quiet = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Start-Process -Wait -FilePath ".\$env:INSTALLER" -ArgumentList ($quiet + '/CURRENTUSER', "/DIR=$dir")
          if (-not (Test-Path "$dir\pdftools.exe")) { throw 'pdftools.exe was not installed' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'PDF Tools.lnk'
          if (-not (Test-Path $shortcut)) { throw 'no Start menu shortcut' }
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList $quiet
          # The uninstaller finishes from a copy of itself; give it a moment.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\pdftools.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\pdftools.exe") { throw 'uninstall left pdftools.exe behind' }
          if (Test-Path $shortcut) { throw 'uninstall left the shortcut behind' }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$PACKAGE"
          cp dist/pdftools README.md LICENSE "$PACKAGE/"
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
          echo "ASSET=$PACKAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS app)
        if: runner.os == 'macOS'
        run: |
          app="PDF Tools.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp dist/pdftools "$app/Contents/MacOS/"
          # The icon at every size macOS asks for.
          mkdir AppIcon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/icon.png --out "AppIcon.iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) packaging/icon.png --out "AppIcon.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$app/Contents/Resources/AppIcon.icns"
          sed "s/@VERSION@/${VERSION%%-*}/" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # Ad-hoc signature: required to run on Apple silicon. Release builds
          # are signed again with the Developer ID and notarized (sign-macos).
          codesign --force --deep --sign - "$app"
          # A disk image with the app and a shortcut to drag it onto Applications.
          mkdir dmg
          mv "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "PDF Tools" -srcfolder dmg -ov -format UDZO "$PACKAGE.dmg"
          echo "ASSET=$PACKAGE.dmg" >> "$GITHUB_ENV"

      - name: Try the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          volume=$(hdiutil attach -nobrowse -readonly "$ASSET" | grep -o '/Volumes/.*')
          test -x "$volume/PDF Tools.app/Contents/MacOS/pdftools"
          test -f "$volume/PDF Tools.app/Contents/Resources/AppIcon.icns"
          test -L "$volume/Applications"
          codesign --verify --deep "$volume/PDF Tools.app"
          hdiutil detach "$volume"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ASSET }}
          # The package is already a .zip, .tar.gz or .dmg: upload it as it is.
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          path: ${{ env.INSTALLER }}
          archive: false
          if-no-files-found: error

  # Release tags, and manual runs that explicitly request it, are signed with
  # the Developer ID certificate and notarized, replacing the build's ad-hoc
  # signed disk image. The keys are secrets of the macos-signing environment,
  # which waits for the owner's approval and only deploys v* tags and main.
  # The job checks out no code and builds nothing: nothing from the
  # repository or its dependencies runs where the keys are.
  sign-macos:
    name: Sign and notarize (macOS)
    if: (github.event_name == 'workflow_dispatch' && inputs.sign_macos == true) || startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: macos-latest
    timeout-minutes: 45
    environment: macos-signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pdftools-*-macos-arm64.dmg
          path: unsigned
          merge-multiple: true

      - name: Signing keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "::error::The macos-signing environment has no MACOS_CERTIFICATE secret."
            exit 1
          fi
          # A keychain of its own, with a random password, for this job only.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<< "$CERTIFICATE" > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # codesign may use the key without asking.
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          # codesign looks for the identity in the user's keychain search list.
          read -ra keychains <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERTIFICATE has no Developer ID Application certificate and key."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign the app and disk image
        run: |
          unsigned=$(echo unsigned/*.dmg)
          test -f "$unsigned"
          asset=$(basename "$unsigned")
          volume=$(hdiutil attach -nobrowse -readonly "$unsigned" | grep -o '/Volumes/.*')
          mkdir dmg
          ditto "$volume/PDF Tools.app" "dmg/PDF Tools.app"
          hdiutil detach "$volume"
          # Hardened runtime and a secure timestamp: notarization requires both.
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "dmg/PDF Tools.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "PDF Tools" -srcfolder dmg -ov -format UDZO "$asset"
          codesign --timestamp --sign "$SIGNING_IDENTITY" "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Notarize
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -z "$API_KEY" || -z "$API_KEY_ID" || -z "$API_ISSUER_ID" ]]; then
            echo "::error::Set APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER_ID in the macos-signing environment."
            exit 1
          fi
          # An App Store Connect API key (the .p8 file's contents).
          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          auth=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          # Waits for Apple's verdict, usually a few minutes.
          result=$(xcrun notarytool submit "$ASSET" "${auth[@]}" --wait --timeout 30m --output-format json) || true
          echo "$result"
          if [[ "$(jq -r .status <<< "$result")" != Accepted ]]; then
            # Apple's log says what it rejected.
            xcrun notarytool log "$(jq -r .id <<< "$result")" "${auth[@]}"
            exit 1
          fi
          # The ticket goes into the disk image, so Gatekeeper accepts it offline.
          xcrun stapler staple "$ASSET"

      - name: Remove the signing keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Try the disk image
        run: |
          # What Gatekeeper checks: notarized, with the ticket stapled.
          xcrun stapler validate "$ASSET"
          spctl --assess --type open --context context:primary-signature --verbose "$ASSET"
          volume=$(hdiutil attach -nobrowse -readonly "$ASSET" | grep -o '/Volumes/.*')
          test -x "$volume/PDF Tools.app/Contents/MacOS/pdftools"
          test -L "$volume/Applications"
          codesign --verify --deep --strict "$volume/PDF Tools.app"
          spctl --assess --type execute --verbose "$volume/PDF Tools.app"
          hdiutil detach "$volume"

      # Replaces the ad-hoc signed disk image of the same name.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ASSET }}
          archive: false
          overwrite: true
          if-no-files-found: error

  ios:
    name: Build and test (iOS)
    if: github.event_name != 'schedule'
    needs: [test, lint]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-ios
          repository-cache: true
      - uses: $/.github/actions/buildbuddy
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Signing team (from the APPLE_TEAM_ID secret; empty on forks)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: printf 'DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID" > ios/Local.xcconfig
      - name: Engine (XCFramework for devices and the simulator)
        run: ios/build-engine.sh --debug
      - name: App for devices (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project PDFTools.xcodeproj -scheme PDFTools -destination "generic/platform=iOS" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Unit and UI tests (iPhone and iPad simulators)
        run: ios/test.sh
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: ios/build/TestResults/*.xcresult
          if-no-files-found: ignore

  android:
    name: Build and test (Android)
    if: github.event_name != 'schedule'
    needs: [test, lint]
    # x86_64 Linux: the only hosted runner with KVM, which the emulator needs
    # (macOS and arm64 Linux runners can't run it accelerated).
    runs-on: ubuntu-latest
    # A cold cache builds the engine twice (debug and release): about 45 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bazel downloads its own Android SDK, NDK, emulator and JDK, so the
      # runner's are removed to make room for them and the system image.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-android
          repository-cache: true
      - uses: $/.github/actions/buildbuddy
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Engine lints (Clippy and rustfmt, for Android)
        run: |
          bazel build --config=ci --config=android --config=clippy --config=rustfmt \
            --platforms=@rules_android//:arm64-v8a //crates/pdftools-ffi:pdftools_jni
      # Before the emulator starts: R8 and the emulator together run the
      # runner out of memory.
      - name: Release app (R8)
        run: |
          bazel build --config=ci --config=android --config=release //android:app
          cp bazel-bin/android/app.apk pdftools-release.apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Every tool on the emulator (debug app)
        run: |
          android/test.sh
          cp android/build/app.apk pdftools-debug.apk
      # Not published yet (they're signed with Bazel's debug key), so the name
      # is outside the release job's pdftools-* pattern.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: pdftools-*.apk
          if-no-files-found: error
      - name: Test screenshots and emulator log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-results
          path: |
            android/build/test
            ~/.cache/pdftools-android/avd/emulator.log
          if-no-files-found: ignore

  # The one check pull requests must pass: fails if any job above failed or
  # was cancelled. (A job skipped because one it needs failed counts as passed
  # for required checks, so requiring Build alone isn't enough.)
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, lint, security, coverage, build, sign-macos, ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Results: $RESULTS"
          test "$FAILED" = false

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sign-macos, coverage, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - name: The tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # "behind" or "identical": the tagged commit is in main's history.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$TAG" --jq .status)
          echo "Tag $TAG compared to main: $status"
          [[ "$status" == behind || "$status" == identical ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # The desktop packages only (each is named after its file), not
          # other jobs' artifacts such as the Android APKs or test results.
          pattern: pdftools-*
          merge-multiple: true
          # Keep the zipped packages as they are.
          skip-decompress: true
      - name: Check the packages
        run: |
          ls -la dist
          # Windows setup and zip, macOS disk image, Linux archive.
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # Signed build provenance: `gh attestation verify <file> --repo <owner/repo>`.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      # The same attestation as a release file, for checking offline
      # (`gh attestation verify <file> --bundle <it> --repo <owner/repo>`) and
      # for tools that look for provenance next to the packages.
      - name: Attach the attestation
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: cp "$BUNDLE" "dist/pdftools-${TAG#v}.intoto.jsonl"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
