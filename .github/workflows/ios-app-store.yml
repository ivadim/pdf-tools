name: Apple TestFlight delivery

# This workflow never runs on a tag push. Start it deliberately from main and
# approve the protected environment only when the build should be uploaded.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing iOS release tag whose CI run passed (for example ios-v1.0)
        type: string
        required: true

      platform:
        description: Platforms to deliver
        type: choice
        options: [ios, macos, both]
        default: ios
        required: true
      mac_version:
        description: macOS marketing version (required for macOS; e.g. 0.5.1)
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-app-store-delivery
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag and CI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          PLATFORM: ${{ inputs.platform }}
          MAC_VERSION: ${{ inputs.mac_version }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == refs/heads/main ]] || { echo 'Run this workflow from main.'; exit 1; }
          [[ "$TAG" =~ ^ios-v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Use an iOS version tag such as ios-v1.0.'; exit 1; }
          if [[ "$PLATFORM" != ios ]]; then
            [[ "$MAC_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Enter a numeric macOS version.'; exit 1; }
          fi
          # GitHub otherwise silently creates a missing, unprotected
          # environment. Refuse to proceed unless approval is configured.
          environment=$(gh api "repos/$GITHUB_REPOSITORY/environments/ios-app-store")
          jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0) and
                 (.deployment_branch_policy.protected_branches == true or .deployment_branch_policy.custom_branch_policies == true)' <<< "$environment" > /dev/null || {
            echo 'Configure ios-app-store with required reviewers and a branch policy first.'; exit 1;
          }
          if [[ "$PLATFORM" != ios ]]; then
            environment=$(gh api "repos/$GITHUB_REPOSITORY/environments/macos-app-store")
            jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0) and
                   (.deployment_branch_policy.protected_branches == true or .deployment_branch_policy.custom_branch_policies == true)' <<< "$environment" > /dev/null || {
              echo 'Configure macos-app-store with required reviewers and a branch policy first.'; exit 1;
            }
          fi
          # Require this run's source to be the exact tag target. This lets
          # checkout use the immutable workflow ref instead of a user-derived
          # ref, and ensures the tag-push CI completed successfully.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$TAG" --jq .status)
          [[ "$status" == behind || "$status" == identical ]]
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          [[ "$commit" == "$WORKFLOW_SHA" ]] || { echo 'Run this workflow from main at the exact commit tagged for delivery.'; exit 1; }
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$TAG" --event push --limit 100 --json headSha,status,conclusion)
          jq -e --arg sha "$commit" 'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")' <<< "$runs" > /dev/null || {
            echo 'No successful tag-push CI run found for this commit.'; exit 1;
          }
          echo "version=${TAG#ios-v}" >> "$GITHUB_OUTPUT"

  prepare:
    if: inputs.platform != 'macos'
    name: Build release engine
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
      - name: Build both engine slices without a remote cache
        run: |
          ios/build-engine.sh
          tar -C ios/Engine -czf "$RUNNER_TEMP/ios-engine.tar.gz" PdftoolsFFI.xcframework
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-engine
          path: ${{ runner.temp }}/ios-engine.tar.gz
          if-no-files-found: error
          retention-days: 1

  deliver:
    if: inputs.platform != 'macos'
    name: Sign and upload iOS to App Store Connect
    needs: [verify, prepare]
    runs-on: macos-latest
    timeout-minutes: 45
    # Configure required reviewers and main-only deployment rules before use.
    environment: ios-app-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-release-engine
          path: ${{ runner.temp }}
      - name: Prepare and check version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ios/Engine
          tar -C ios/Engine -xzf "$RUNNER_TEMP/ios-engine.tar.gz"
          version=$(xcodebuild -project ios/PDFTools.xcodeproj -scheme PDFTools -configuration Release -showBuildSettings | sed -n 's/^ *MARKETING_VERSION = //p' | head -1)
          [[ "$version" == "$VERSION" ]] || { echo "App version $version does not match tag $VERSION."; exit 1; }
          plutil -lint ios/PDFTools/PrivacyInfo.xcprivacy
          # Keep arbitrary project build scripts off the runner that will
          # receive the distribution key. Review any change to this policy.
          plutil -convert json -o "$RUNNER_TEMP/project.json" ios/PDFTools.xcodeproj/project.pbxproj
          python3 - <<'PY'
          import json, os, sys
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'project.json')) as f:
              objects = json.load(f)['objects'].values()
          if any(o.get('isa') in ('PBXShellScriptBuildPhase', 'PBXBuildRule') for o in objects):
              sys.exit('Project build scripts or custom build rules require a signing security review.')
          PY
          # A fresh number for each run and rerun; the tagged source version is unchanged.
          (( GITHUB_RUN_NUMBER <= 9999 && GITHUB_RUN_ATTEMPT <= 99 )) || { echo 'Build number limit reached.'; exit 1; }
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Install signing assets
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CERTIFICATE" && -n "$CERTIFICATE_PASSWORD" && -n "$PROFILE" && -n "$TEAM_ID" ]] || { echo 'Missing iOS signing secrets.'; exit 1; }
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read().strip(), validate=True))' <<< "$CERTIFICATE" > "$RUNNER_TEMP/ios-certificate.p12"
          security import "$RUNNER_TEMP/ios-certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/ios-certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          read -ra keychains <<< "$(security list-keychains -d user | tr -d '\"')"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          security find-identity -v -p codesigning "$keychain" | grep -q '"Apple Distribution:' || { echo 'No Apple Distribution identity.'; exit 1; }
          python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read().strip(), validate=True))' <<< "$PROFILE" > "$RUNNER_TEMP/ios.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/ios.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import datetime, os, plistlib, sys
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'profile.plist'), 'rb') as f:
              profile = plistlib.load(f)
          entitlements = profile.get('Entitlements', {})
          if (profile.get('ExpirationDate', datetime.datetime.min) <= datetime.datetime.utcnow()
                  or profile.get('ProvisionedDevices') or profile.get('ProvisionsAllDevices')
                  or entitlements.get('get-task-allow') is not False):
              sys.exit('The profile is expired or is not an App Store distribution profile.')
          PY
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          [[ "$profile_uuid" =~ ^[A-Fa-f0-9-]{36}$ ]] || { echo 'Invalid profile UUID.'; exit 1; }
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          [[ "$app_id" == "$TEAM_ID.io.github.ivadim.pdftools" ]] || { echo 'Provisioning profile does not match the team and bundle ID.'; exit 1; }
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$RUNNER_TEMP/ios.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"

      - name: Archive and export for App Store Connect
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project ios/PDFTools.xcodeproj -scheme PDFTools -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-derived" \
            -archivePath "$RUNNER_TEMP/PDFTools.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive
          plutil -lint "$RUNNER_TEMP/PDFTools.xcarchive/Products/Applications/PDF Tools.app/PrivacyInfo.xcprivacy"
          export TEAM_ID PROFILE_UUID
          python3 - <<'PY'
          import os, plistlib
          options = {'method': 'app-store-connect', 'destination': 'export', 'signingStyle': 'manual',
                     'teamID': os.environ['TEAM_ID'], 'signingCertificate': 'Apple Distribution',
                     'provisioningProfiles': {'io.github.ivadim.pdftools': os.environ['PROFILE_UUID']},
                     'manageAppVersionAndBuildNumber': False, 'uploadSymbols': True}
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PDFTools.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test "$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')" = 1

      - name: Upload to App Store Connect
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          [[ -n "$API_KEY" && -n "$API_KEY_ID" && -n "$API_ISSUER_ID" ]] || { echo 'Missing App Store Connect API secrets.'; exit 1; }
          [[ "$API_KEY_ID" =~ ^[A-Za-z0-9]+$ ]] || { echo 'Invalid API key ID.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/private_keys"
          python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read().strip(), validate=True))' <<< "$API_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          ipa=("$RUNNER_TEMP"/ios-export/*.ipa)
          xcrun altool --validate-app -f "${ipa[0]}" -t ios --api-key "$API_KEY_ID" --api-issuer "$API_ISSUER_ID"
          xcrun altool --upload-app -f "${ipa[0]}" -t ios --api-key "$API_KEY_ID" --api-issuer "$API_ISSUER_ID"

      - name: Remove signing and API keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ios-certificate.p12" "$RUNNER_TEMP/ios.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -rf "$RUNNER_TEMP/private_keys"
          if [[ -n "${PROFILE_UUID:-}" ]]; then rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi

  mac-prepare:
    name: Build macOS TestFlight candidate
    if: inputs.platform != 'ios'
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: false
      - name: Build sandboxed candidate
        env:
          VERSION: ${{ inputs.mac_version }}
        run: |
          set -euo pipefail
          source_version=$(sed -n 's/^VERSION = "\([0-9.]*\)"$/\1/p' version.bzl)
          [[ "$VERSION" == "$source_version" ]] || { echo 'Mac version must match version.bzl.'; exit 1; }
          packaging/macos/sandbox-build.sh "$RUNNER_TEMP/PDF Tools.app"
          cp packaging/macos/AppStore.entitlements "$RUNNER_TEMP/AppStore.entitlements"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/mac-candidate.tar.gz" 'PDF Tools.app' AppStore.entitlements
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-testflight-candidate
          path: ${{ runner.temp }}/mac-candidate.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Block delivery until Mac release validation is complete
        run: |
          echo '::error::Complete Mac sandbox export validation and review the untested signing workflow before enabling TestFlight delivery.'
          exit 1

  mac-deliver:
    name: Sign and upload macOS to App Store Connect
    if: inputs.platform != 'ios'
    needs: [verify, mac-prepare]
    runs-on: macos-latest
    timeout-minutes: 45
    environment: macos-app-store
    steps:
      # No checkout or build runs on the credentialed runner.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-testflight-candidate
          path: ${{ runner.temp }}
      - name: Check candidate and prepare build number
        env:
          VERSION: ${{ inputs.mac_version }}
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/mac-candidate.tar.gz"
          app="$RUNNER_TEMP/PDF Tools.app"
          test -f "$app/Contents/MacOS/pdftools"
          plutil -lint "$app/Contents/Info.plist" "$RUNNER_TEMP/AppStore.entitlements"
          [[ $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist") == io.github.ivadim.pdftools ]]
          [[ $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist") == "$VERSION" ]]
          (( GITHUB_RUN_NUMBER <= 9999 && GITHUB_RUN_ATTEMPT <= 99 )) || { echo 'Build number limit reached.'; exit 1; }
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" "$app/Contents/Info.plist"
      - name: Install distribution identities and profile
        env:
          APP_CERT: ${{ secrets.MAC_APP_DISTRIBUTION_CERTIFICATE }}
          APP_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT: ${{ secrets.MAC_INSTALLER_CERTIFICATE }}
          INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.MAC_APP_STORE_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ -n "$APP_CERT" && -n "$APP_PASSWORD" && -n "$INSTALLER_CERT" && -n "$INSTALLER_PASSWORD" && -n "$PROFILE" && "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo 'Missing or invalid macOS signing secrets.'; exit 1; }
          keychain="$RUNNER_TEMP/mac-store.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read().strip(), validate=True))' <<< "$APP_CERT" > "$RUNNER_TEMP/app.p12"
          python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read().strip(), validate=True))' <<< "$INSTALLER_CERT" > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$APP_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$INSTALLER_PASSWORD" -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          read -ra keychains <<< "$(security list-keychains -d user | tr -d '\"')"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          app_identity=$(security find-identity -v -p codesigning "$keychain" | awk -v team="($TEAM_ID)" '/"Apple Distribution: / && index($0, team) {print $2; exit}')
          installer_identity=$(security find-identity -v "$keychain" | awk -v team="($TEAM_ID)" '/"3rd Party Mac Developer Installer: / && index($0, team) {print $2; exit}')
          [[ -n "$app_identity" && -n "$installer_identity" ]] || { echo 'Missing matching Mac App Store signing identities.'; exit 1; }
          echo "APP_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$installer_identity" >> "$GITHUB_ENV"
          python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read().strip(), validate=True))' <<< "$PROFILE" > "$RUNNER_TEMP/profile.provisionprofile"
          security cms -D -i "$RUNNER_TEMP/profile.provisionprofile" > "$RUNNER_TEMP/profile.plist"
          export app_identity
          python3 - <<'PY'
          import datetime, hashlib, os, plistlib, sys
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'profile.plist'), 'rb') as f:
              profile = plistlib.load(f)
          ent = profile.get('Entitlements', {})
          expected = os.environ['TEAM_ID'] + '.io.github.ivadim.pdftools'
          if (profile.get('ExpirationDate', datetime.datetime.min) <= datetime.datetime.utcnow()
                  or profile.get('ProvisionedDevices') or profile.get('ProvisionsAllDevices')
                  or ent.get('com.apple.security.get-task-allow', False) is not False
                  or ent.get('get-task-allow', False) is not False
                  or ent.get('com.apple.application-identifier') != expected
                  or os.environ['app_identity'].upper() not in {
                      hashlib.sha1(cert).hexdigest().upper() for cert in profile.get('DeveloperCertificates', [])
                  }):
              sys.exit('Profile is expired or does not match the macOS app, team, and signing certificate.')
          PY
          cp "$RUNNER_TEMP/profile.provisionprofile" "$RUNNER_TEMP/PDF Tools.app/Contents/embedded.provisionprofile"
      - name: Sign and package
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/PDF Tools.app"
          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $TEAM_ID.io.github.ivadim.pdftools" "$RUNNER_TEMP/AppStore.entitlements"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$RUNNER_TEMP/AppStore.entitlements"
          codesign --force --sign "$APP_IDENTITY" --entitlements "$RUNNER_TEMP/AppStore.entitlements" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          productbuild --component "$app" /Applications --sign "$INSTALLER_IDENTITY" "$RUNNER_TEMP/PDFTools.pkg"
          pkgutil --check-signature "$RUNNER_TEMP/PDFTools.pkg"
      - name: Validate and upload
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          [[ -n "$API_KEY" && "$API_KEY_ID" =~ ^[A-Za-z0-9]+$ && -n "$API_ISSUER_ID" ]] || { echo 'Missing App Store Connect API secrets.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/private_keys"
          python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read().strip(), validate=True))' <<< "$API_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          xcrun altool --validate-app -f "$RUNNER_TEMP/PDFTools.pkg" -t macos --api-key "$API_KEY_ID" --api-issuer "$API_ISSUER_ID"
          xcrun altool --upload-app -f "$RUNNER_TEMP/PDFTools.pkg" -t macos --api-key "$API_KEY_ID" --api-issuer "$API_ISSUER_ID"
      - name: Remove credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mac-store.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/profile.provisionprofile" "$RUNNER_TEMP/profile.plist"
          rm -rf "$RUNNER_TEMP/private_keys"
