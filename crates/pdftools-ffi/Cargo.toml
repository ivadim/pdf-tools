[package]
name = "pdftools-ffi"
description = "C and JNI interfaces to the PDF Tools engine, linked into the iOS and Android apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
pdftools-cli = { path = "../pdftools-cli" }
pdftools-core.workspace = true
pdftools-render.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
