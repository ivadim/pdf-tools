[package]
name = "pdftools-iced"
description = "PDF Tools desktop app built with iced (experimental)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pdftools-iced"
path = "src/main.rs"

[dependencies]
pdftools-core.workspace = true
pdftools-render.workspace = true
lopdf.workspace = true
# Software rendering only (no GPU stack), raw-pixel images (pages and photos
# are decoded by us), SVG icons and a canvas for the signature pad.
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "image-without-codecs",
    "svg",
    "canvas",
    "thread-pool",
    "crisp",
    "x11",
    "wayland",
] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
iced_test = "0.14"
