[package]
name = "pdftools-app"
description = "PDF Tools desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pdftools"
path = "src/main.rs"

[dependencies]
pdftools-core.workspace = true
pdftools-render.workspace = true
lopdf.workspace = true
# Software rendering only (no GPU stack), raw-pixel images (pages and photos
# are decoded by us), SVG icons and a canvas for the signature pad.
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "image-without-codecs",
    "svg",
    "canvas",
    "thread-pool",
    "crisp",
    "x11",
    "wayland",
] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Embeds the icon and version details in pdftools.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
iced_test = "0.14"
# For examples/render_icons.rs (resvg is already built for iced's SVG icons).
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
