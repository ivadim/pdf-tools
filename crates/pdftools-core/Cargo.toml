[package]
name = "pdftools-core"
description = "GUI-independent PDF operations used by PDF Tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
lopdf.workspace = true
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
getrandom = "0.4"
# Deflate for image pixels and streams, compressed on several threads
# (already used through lopdf).
flate2 = "1"

# Large PDFs are mapped rather than read on iOS (see `read_file`).
[target.'cfg(target_os = "ios")'.dependencies]
memmap2 = "0.9"

[dev-dependencies]
# Checks the encryption independently of lopdf (already one of its dependencies).
aes = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
