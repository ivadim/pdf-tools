[package]
name = "pdftools-core"
description = "GUI-independent PDF operations used by PDF Tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
lopdf.workspace = true
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
getrandom = "0.4"
# Deflate for image pixels and streams, compressed on several threads
# (already used through lopdf).
flate2 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSPathUtilities", "NSString", "NSURL"] }

# Large PDFs are mapped rather than read on iOS and Android (see `read_file`).
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
memmap2 = "0.9"

[dev-dependencies]
# Checks the encryption independently of lopdf (already one of its dependencies).
aes = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
