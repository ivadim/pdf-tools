<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Paperform: a continuous folded-paper P. Full-bleed master; the renderer
       adds the desktop tile and extracts the Android foreground from this file.
       Keep the background ID: it identifies the removable background layer. -->
  <defs>
    <linearGradient id="paper-top" x1="400" y1="200" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#f1ede7"/>
    </linearGradient>
    <linearGradient id="paper-inside" x1="248" y1="350" x2="412" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5beb5"/><stop offset="0.45" stop-color="#d9d3cb"/><stop offset="1" stop-color="#ede8e1"/>
    </linearGradient>
    <linearGradient id="paper-face" x1="410" y1="490" x2="520" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#e5dfd7"/>
    </linearGradient>
    <linearGradient id="paper-turn" x1="655" y1="230" x2="735" y2="485" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f0ea"/>
    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" fill="#e52b16"/>
  <g id="mark" transform="translate(-61.44 -61.44) scale(1.12)">
    <!-- The open counter is actual negative space, including on Android. -->
    <path fill="#fffaf4" fill-rule="evenodd" d="M248 334 382 200H594C702 200 790 324 790 406 790 528 690 642 574 642H412V814H248V334ZM412 344V492H624L669 344H412Z"/>
    <path fill="url(#paper-inside)" d="M248 344H412V492L248 656V344Z"/>
    <path fill="#d9d2c9" d="M248 814 412 642V814H248Z"/>
    <path fill="url(#paper-face)" d="M624 492C706 492 790 470 790 406 790 528 690 642 574 642H412L248 814V656L412 492H624Z"/>
    <path fill="url(#paper-top)" d="M248 344V334L382 200H594C654 200 694 235 686 283L669 344H248Z"/>
    <path fill="url(#paper-turn)" d="M594 200C702 200 790 324 790 406 790 470 706 492 624 492L680 306C697 250 667 211 594 200Z"/>
  </g>
</svg>
